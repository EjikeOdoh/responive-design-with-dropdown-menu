<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Epilogue:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="styles/index.css">

  <title>Frontend Mentor | Intro section with dropdown navigation</title>

</head>

<body>
  <header>
    <div class="logo">
      <img src="images/logo.svg" />
    </div>
    <nav>
      <div class="left-nav">
        <button id="features">
          Features
          <img id="asiya" src="images/icon-arrow-down.svg" cbc="2026" />

          <!-- Dropdown for features -->
          <div>
            <a href="">
              <img src="images/icon-todo.svg" />
              Todo List</a>
            <a href="">
              <img src="images/icon-calendar.svg" />
              Calender</a>
            <a href="">
              <img src="images/icon-reminders.svg" /> Reminders</a>
            <a href="">
              <img src="images/icon-planning.svg" />
              Planning</a>
          </div>
        </button>

        <button id="company">Company
          <img src="images/icon-arrow-down.svg" />

          <!-- Dropdown for Company -->
          <div>
            <a href="">History</a>
            <a href="">Our Team</a>
            <a href="">Blog</a>
          </div>
        </button>
        <a href="">Careers</a>
        <a href="">About</a>
      </div>
      <div class="right-nav">
        <a href="">Login</a>
        <a href="">Register</a>
      </div>
    </nav>
    <button>
      <img src="images/icon-menu.svg" />
    </button>

    <!-- Mobile Menu -->
    <nav id="mobile-menu">
      <button>
        <img src="images/icon-close-menu.svg" />
      </button>
      <div class="">
        <button id="features-mobile">
          Features
          <img src="images/icon-arrow-down.svg" cbc="2026" />

          <!-- Dropdown for features -->
          <div>
            <a href="">
              <img src="images/icon-todo.svg" />
              Todo List</a>
            <a href="">
              <img src="images/icon-calendar.svg" />
              Calender</a>
            <a href="">
              <img src="images/icon-reminders.svg" /> Reminders</a>
            <a href="">
              <img src="images/icon-planning.svg" />
              Planning</a>
          </div>
        </button>

        <button id="company-mobile">Company
          <img src="images/icon-arrow-down.svg" />

          <!-- Dropdown for Company -->
          <div>
            <a href="">History</a>
            <a href="">Our Team</a>
            <a href="">Blog</a>
          </div>
        </button>
        <a href="">Careers</a>
        <a href="">About</a>
      </div>
      <div class="">
        <a href="">Login</a>
        <a href="">Register</a>
      </div>
    </nav>
  </header>
  <main>
    <div class="left">
      <div class="top">
        <h1>
          Make remote work
        </h1>
        <p>
          Get your team in sync, no matter your location. Streamline processes,
          create team rituals, and watch productivity soar.
        </p>
        <button>
          Learn more
        </button>
      </div>

      <div class="brands">
        <div class="brand">
          <img src="images/client-databiz.svg" />
        </div>
        <div class="brand">
          <img src="images/client-audiophile.svg" />
        </div>
        <div class="brand">
          <img src="images/client-meet.svg" />
        </div>
        <div class="brand">
          <img src="images/client-maker.svg" />
        </div>
      </div>
    </div>
    <div class="right">
      <img src="images/image-hero-desktop.png" />
    </div>
  </main>
  <script src="script.js"></script>
</body>

</html>
